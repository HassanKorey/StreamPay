name: 🐛 Bug Report
description: Report a reproducible bug in the StreamPay contract, SDK, or web application.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of StreamPay is affected?
      options:
        - "Smart Contract (streampay-contract)"
        - "TypeScript SDK (@streampay/sdk)"
        - "Web dApp (apps/web)"
        - "Deployment & Scripts"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Go to '/create'
        2. Enter payee address '...'
        3. Click 'Create Stream'
        4. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Expected stream to open and redirect to /stream/[id]...
    validations:
      required: true
  - type: input
    id: tx_hash
    attributes:
      label: Stellar Testnet Transaction Hash / Ledger (if applicable)
      description: Provide the transaction hash or stream ID from the explorer.
      placeholder: "e.g., 583556e29f4ff2026069f7c31d7571eb3a395da4902dfd59a788bbad45b1aa66"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: OS, browser, Freighter version, Node.js version, etc.
      placeholder: |
        - OS: Ubuntu 24.04 / macOS Sequoia
        - Browser: Chrome 130
        - Wallet: Freighter v5.x
        - Node.js: v22+
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any error logs, console screenshots, or diagnostic event traces.
